name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  isaac-sim:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: isaac-sim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "numpy>=1.26,<3"
      - run: python -m unittest test_teleop_mapping.py test_g1_locomotion.py
      - run: python -m compileall -q .
